# ~/.config/tmux/tmux.conf (lub ~/.tmux.conf -> source-file ~/.config/tmux/tmux.conf)
# QTechCore Cyberdeck (RPi4)

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse off
set -g history-limit 5000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0

# --- Ramki paneli ---
set -g pane-border-style "fg=#1a1a22"
set -g pane-active-border-style "fg=#2de2c9"

# --- Pasek statusu ---
# WYLACZONY: ekran SPI ma tylko 60x20 znakow, a dashboard.py jest zaprojektowany
# pod dokladnie 20 wierszy. Pasek statusu na dole zabieralby 1 wiersz, ucinajac
# ostatni wiersz dashboardu. Dashboard i tak pokazuje wlasny hostname/zegar w
# headerze, wiec pasek tmux tu nie jest potrzebny.
# Zeby wlaczyc z powrotem (np. do normalnej pracy w drugim oknie): `Ctrl-b :` -> `set -g status on`
set -g status off

# --- Keybindy (prefix domyślnie Ctrl-b) ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
