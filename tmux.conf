# ~/.config/tmux/tmux.conf (lub ~/.tmux.conf -> source-file ~/.config/tmux/tmux.conf)
# QTechCore Cyberdeck (RPi4)

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse off
set -g history-limit 5000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0

# --- Ramki paneli ---
set -g pane-border-style "fg=#1a1a22"
set -g pane-active-border-style "fg=#2de2c9"

# --- Pasek statusu ---
set -g status-position bottom
set -g status-style "bg=#0a0a0f,fg=#c5d1de"
set -g status-left-length 40
set -g status-right-length 60

set -g status-left "#[fg=#0a0a0f,bg=#2de2c9,bold] #S #[fg=#2de2c9,bg=#0a0a0f]"
set -g status-right "#[fg=#b967ff]%H:%M #[fg=#3a3a45]| #[fg=#2de2c9]%d-%m-%Y "

setw -g window-status-current-format "#[fg=#0a0a0f,bg=#2de2c9,bold] #I:#W "
setw -g window-status-format "#[fg=#6a6a75] #I:#W "

# --- Keybindy (prefix domyślnie Ctrl-b) ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
